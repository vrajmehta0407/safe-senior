<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SafeSenior Admin - Operations Console</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#008080",
              "primary-hover": "#006565",
              "primary-container": "#004f4f",
              "primary-light": "#e0f2f2",
              "on-primary": "#ffffff",
              "on-primary-container": "#e3fffe",

              "secondary": "#aa361f",
              "secondary-container": "#fe7356",
              "on-secondary": "#ffffff",

              "tertiary": "#735c00",
              "tertiary-container": "#cca830",

              "success": "#10b981",
              "success-container": "rgba(16, 185, 129, 0.15)",
              "error": "#ef4444",
              "error-container": "rgba(239, 68, 68, 0.15)",
              "warning": "#f59e0b",
              "warning-container": "rgba(245, 158, 11, 0.15)",
              "info": "#3b82f6",
              "info-container": "rgba(59, 130, 246, 0.15)",

              "background": "#0f172a",
              "surface": "#1e293b",
              "surface-container-lowest": "#1e293b",
              "surface-container-low": "#192234",
              "surface-container": "#27354a",
              "surface-container-high": "#334155",
              "surface-container-highest": "#475569",
              "surface-bright": "#1e293b",
              "surface-dim": "#0f172a",

              "on-background": "#f8fafc",
              "on-surface": "#f8fafc",
              "on-surface-variant": "#94a3b8",
              "outline": "#475569",
              "outline-variant": "#334155"
            },
            borderRadius: {
              DEFAULT: "0.5rem",
              md: "0.75rem",
              lg: "1rem",
              xl: "1.25rem",
              "2xl": "1.5rem",
              "3xl": "2rem",
              full: "9999px"
            },
            fontFamily: {
              "headline-lg": ["Plus Jakarta Sans", "sans-serif"],
              "headline-md": ["Plus Jakarta Sans", "sans-serif"],
              "headline-sm": ["Plus Jakarta Sans", "sans-serif"],
              "body-lg": ["Inter", "sans-serif"],
              "body-md": ["Inter", "sans-serif"],
              "label-md": ["Inter", "sans-serif"],
              "mono": ["Fira Code", "monospace"]
            }
          }
        }
      }
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .icon-fill {
        font-variation-settings: 'FILL' 1;
      }
      .soft-shadow, .ambient-shadow {
        box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.08);
      }
      .masonry-grid {
        column-count: 1;
        column-gap: 24px;
      }
      @media (min-width: 768px) { .masonry-grid { column-count: 2; } }
      @media (min-width: 1024px) { .masonry-grid { column-count: 3; } }
      .masonry-item { break-inside: avoid; margin-bottom: 24px; }
      @keyframes pulse-ring {
        0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0.8; }
        100% { transform: translate(-50%, -50%) scale(2.2); opacity: 0; }
      }
      .hotspot-pulse {
        animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
    </style>
  </head>
  <body class="bg-background text-on-background font-body-md min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
