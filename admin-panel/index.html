<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SafeSenior Admin - Operations Console</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,200..800;1,200..800&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "inverse-surface": "#303031",
              "surface-container-low": "#f5f3f3",
              "tertiary-fixed-dim": "#e9c349",
              "secondary-container": "#fe7356",
              "surface": "#fbf9f9",
              "tertiary": "#735c00",
              "on-primary": "#ffffff",
              "on-error-container": "#93000a",
              "secondary-fixed-dim": "#ffb4a4",
              "primary": "#006565",
              "on-primary-container": "#e3fffe",
              "primary-fixed-dim": "#76d6d5",
              "on-tertiary-container": "#4f3e00",
              "outline": "#6e7979",
              "surface-bright": "#fbf9f9",
              "primary-container": "#008080",
              "on-error": "#ffffff",
              "on-primary-fixed": "#002020",
              "surface-container-high": "#e9e8e7",
              "surface-container": "#efeded",
              "primary-fixed": "#93f2f2",
              "secondary-fixed": "#ffdad3",
              "on-tertiary-fixed-variant": "#574500",
              "error": "#ba1a1a",
              "on-tertiary": "#ffffff",
              "error-container": "#ffdad6",
              "outline-variant": "#bdc9c8",
              "on-secondary-container": "#6d0f00",
              "on-secondary-fixed": "#3e0500",
              "on-surface-variant": "#3e4949",
              "secondary": "#aa361f",
              "surface-tint": "#006a6a",
              "surface-variant": "#e3e2e2",
              "tertiary-fixed": "#ffe088",
              "on-tertiary-fixed": "#241a00",
              "surface-container-highest": "#e3e2e2",
              "surface-container-lowest": "#ffffff",
              "inverse-on-surface": "#f2f0f0",
              "inverse-primary": "#76d6d5",
              "on-secondary-fixed-variant": "#891e08",
              "background": "#fbf9f9",
              "on-background": "#1b1c1c",
              "tertiary-container": "#cca830",
              "on-primary-fixed-variant": "#004f4f",
              "on-secondary": "#ffffff",
              "on-surface": "#1b1c1c",
              "surface-dim": "#dbdad9"
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              "2xl": "1rem",
              "3xl": "1.5rem",
              full: "9999px"
            },
            spacing: {
              unit: "8px",
              "gutter-mobile": "16px",
              "margin-desktop": "64px",
              "gutter-desktop": "24px",
              "target-size": "48px",
              "margin-mobile": "20px"
            },
            fontFamily: {
              "label-lg": ["Atkinson Hyperlegible Next", "sans-serif"],
              "body-lg": ["Atkinson Hyperlegible Next", "sans-serif"],
              "headline-sm": ["Plus Jakarta Sans", "sans-serif"],
              "body-md": ["Atkinson Hyperlegible Next", "sans-serif"],
              "label-md": ["Atkinson Hyperlegible Next", "sans-serif"],
              "headline-md": ["Plus Jakarta Sans", "sans-serif"],
              "headline-lg": ["Plus Jakarta Sans", "sans-serif"]
            },
            fontSize: {
              "label-lg": ["18px", { lineHeight: "24px", fontWeight: "600" }],
              "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }],
              "headline-sm": ["20px", { lineHeight: "28px", fontWeight: "600" }],
              "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
              "label-md": ["14px", { lineHeight: "20px", letterSpacing: "0.05em", fontWeight: "700" }],
              "headline-md": ["24px", { lineHeight: "32px", fontWeight: "600" }],
              "headline-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "700" }]
            }
          }
        }
      }
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .icon-fill {
        font-variation-settings: 'FILL' 1;
      }
      .soft-shadow, .ambient-shadow {
        box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.08);
      }
      .masonry-grid {
        column-count: 1;
        column-gap: 24px;
      }
      @media (min-width: 768px) { .masonry-grid { column-count: 2; } }
      @media (min-width: 1024px) { .masonry-grid { column-count: 3; } }
      .masonry-item { break-inside: avoid; margin-bottom: 24px; }
      @keyframes pulse-ring {
        0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0.8; }
        100% { transform: translate(-50%, -50%) scale(2.2); opacity: 0; }
      }
      .hotspot-pulse {
        animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
    </style>
  </head>
  <body class="bg-background text-on-background font-body-md min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
