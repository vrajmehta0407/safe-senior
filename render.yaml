# Render.com Blueprint configuration for Safe Senior
# Enables free 24/7 cloud hosting with PostgreSQL so no local server is required.

services:
  - type: web
    name: safe-senior-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: safesenior-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        value: vrajmehta0407@gmail.com
      - key: SMTP_PASS
        value: rcjjobumdutrbdmh
      - key: EMAIL_FROM
        value: "SafeSenior <vrajmehta0407@gmail.com>"

databases:
  - name: safesenior-db
    plan: free
    databaseName: safesenior
    user: safesenior
